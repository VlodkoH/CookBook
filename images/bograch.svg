<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Боґрач — ілюстрація</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="stew" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- shadow -->
  <ellipse cx="400" cy="448" rx="250" ry="22" fill="#1e1b4b" opacity=".18"/>
  <!-- bowl body and rim -->
  <path d="M138 250c0 130 100 195 262 195s262-65 262-195z" fill="url(#bowl)"/>
  <path d="M175 300c30 70 110 110 225 110" fill="none" stroke="#fdba74" stroke-width="6" stroke-linecap="round" opacity=".35"/>
  <ellipse cx="400" cy="250" rx="262" ry="68" fill="#d97706"/>
  <ellipse cx="400" cy="250" rx="245" ry="57" fill="url(#stew)"/>
  <!-- potatoes -->
  <g fill="#fde68a" stroke="#d97706" stroke-width="3">
    <rect x="243" y="236" width="36" height="28" rx="9" transform="rotate(-12 261 250)"/>
    <rect x="335" y="212" width="36" height="28" rx="9" transform="rotate(10 353 226)"/>
    <rect x="455" y="256" width="36" height="28" rx="9" transform="rotate(-8 473 270)"/>
    <rect x="525" y="226" width="36" height="28" rx="9" transform="rotate(15 543 240)"/>
    <rect x="380" y="262" width="36" height="28" rx="9" transform="rotate(5 398 276)"/>
  </g>
  <!-- sausage slices -->
  <g>
    <circle cx="310" cy="266" r="17" fill="#7f1d1d"/><circle cx="310" cy="266" r="10" fill="#b45309"/>
    <circle cx="432" cy="232" r="17" fill="#7f1d1d"/><circle cx="432" cy="232" r="10" fill="#b45309"/>
    <circle cx="505" cy="214" r="17" fill="#7f1d1d"/><circle cx="505" cy="214" r="10" fill="#b45309"/>
    <circle cx="372" cy="250" r="17" fill="#7f1d1d"/><circle cx="372" cy="250" r="10" fill="#b45309"/>
    <circle cx="300" cy="228" r="17" fill="#7f1d1d"/><circle cx="300" cy="228" r="10" fill="#b45309"/>
  </g>
  <!-- carrot slices -->
  <g fill="#fb923c" stroke="#c2410c" stroke-width="2">
    <circle cx="335" cy="246" r="8"/><circle cx="485" cy="236" r="8"/>
    <circle cx="425" cy="270" r="8"/><circle cx="560" cy="262" r="8"/>
    <circle cx="268" cy="272" r="8"/>
  </g>
  <!-- bell pepper strips -->
  <g fill="#65a30d">
    <rect x="395" y="246" width="30" height="8" rx="4" transform="rotate(-25 410 250)"/>
    <rect x="520" y="256" width="30" height="8" rx="4" transform="rotate(20 535 260)"/>
    <rect x="270" y="252" width="30" height="8" rx="4" transform="rotate(15 285 256)"/>
  </g>
  <!-- beans -->
  <g fill="#fef3c7">
    <ellipse cx="350" cy="274" rx="8" ry="5" transform="rotate(-20 350 274)"/>
    <ellipse cx="460" cy="224" rx="8" ry="5" transform="rotate(15 460 224)"/>
    <ellipse cx="330" cy="222" rx="8" ry="5" transform="rotate(30 330 222)"/>
    <ellipse cx="520" cy="244" rx="8" ry="5" transform="rotate(-10 520 244)"/>
    <ellipse cx="445" cy="280" rx="8" ry="5" transform="rotate(25 445 280)"/>
    <ellipse cx="560" cy="238" rx="8" ry="5" transform="rotate(5 560 238)"/>
    <ellipse cx="290" cy="262" rx="8" ry="5" transform="rotate(-30 290 262)"/>
    <ellipse cx="402" cy="222" rx="8" ry="5" transform="rotate(10 402 222)"/>
  </g>
  <!-- parsley -->
  <g fill="#16a34a">
    <ellipse cx="398" cy="244" rx="14" ry="6" transform="rotate(-35 398 244)"/>
    <ellipse cx="414" cy="240" rx="14" ry="6" transform="rotate(25 414 240)"/>
    <ellipse cx="406" cy="252" rx="14" ry="6" transform="rotate(80 406 252)"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".7">
    <path d="M340 180c-26-26 26-46 0-72"/>
    <path d="M400 170c-26-26 26-46 0-72"/>
    <path d="M460 180c-26-26 26-46 0-72"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
