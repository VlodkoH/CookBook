<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#78c9ed"/><stop offset="1" stop-color="#d8e9b0"/></linearGradient>
 <linearGradient id="hills" x2="0" y2="1"><stop stop-color="#789d55"/><stop offset="1" stop-color="#315b37"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="0"><stop stop-color="#5a301b"/><stop offset=".45" stop-color="#bd7940"/><stop offset="1" stop-color="#63351e"/></linearGradient>
 <linearGradient id="iron" x2="0.2" y2="1"><stop stop-color="#41413d"/><stop offset=".35" stop-color="#171817"/><stop offset="1" stop-color="#050606"/></linearGradient>
 <linearGradient id="broth" x2="0" y2="1"><stop stop-color="#ff9a32"/><stop offset=".45" stop-color="#c9360d"/><stop offset="1" stop-color="#731b0c"/></linearGradient>
 <linearGradient id="fire" x2="0" y2="1"><stop stop-color="#fff27a"/><stop offset=".45" stop-color="#ff8b16"/><stop offset="1" stop-color="#c6280b"/></linearGradient>
 <radialGradient id="steam"><stop stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<!-- countryside background -->
<rect width="800" height="500" fill="url(#sky)"/>
