<g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".58"><path d="M345 140Q320 115 345 91Q367 68 346 48"/><path d="M405 139Q382 111 408 88Q430 65 409 40"/><path d="M465 142Q445 119 467 96Q490 72 468 55"/></g>
